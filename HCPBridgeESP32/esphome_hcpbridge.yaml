# Variables to change the name of the entities
substitutions:
  name: "hcpbridge"
  friendly_name: "Garage Door"
  connection_state: "${name} Connected"
  relay_name: "${friendly_name} Relay state"
  # Renamed from "light" so the substitution name does not shadow the light: component block
  light_name: "${friendly_name} Light"
  btn_vent: "${friendly_name} Vent" 
  btn_half: "${friendly_name} Half" 
  btn_impulse: "${friendly_name} Impulse" 
  sen_txt: "${friendly_name} State" 
  sw_vent: "${friendly_name} Venting" 
  sw_half: "${friendly_name} Open Half" 
  sen_pos: "${friendly_name} Position" 

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  project:
    name: "gifford47.hcpbridge"
    version: "1.0.1"
  libraries:
    - emelianov/modbus-esp8266
  platformio_options:
    board_build.f_cpu: 240000000L
    # 4 MB upload limit - must match the flash_size set under esp32:
    board_upload.maximum_size: 4194304
    # NOTE: PSRAM is no longer enabled via raw -DBOARD_HAS_PSRAM here.
    # It is configured the idiomatic way through the psram: block below.

external_components:
  - source: github://Gifford47/esphome-hcpbridge
    refresh: 0s
  # Pin the core "uart" component to a fixed ESPHome release for a stable API.
  # IMPORTANT: keep this version aligned with your installed ESPHome version -
  # pulling a core component from a different release can break the build.
  - source: github://esphome/esphome@2025.9.3
    refresh: 0s
    components: [uart]

esp32:
  board: esp32-s3-devkitc-1 #set your board
  flash_size: 4MB
  framework:
    type: arduino

# PSRAM - the idiomatic ESPHome way (replaces the raw -DBOARD_HAS_PSRAM flag).
# ONLY enable this if your board physically has PSRAM (e.g. ESP32-S3 N4R2 / N8R8).
# On a board WITHOUT PSRAM this will cause boot loops - delete this whole block instead.
#psram:
#  mode: quad      # use "octal" for octal-PSRAM modules (e.g. N8R8)
#  speed: 80MHz

i2c:
  sda: GPIO06
  scl: GPIO05
  scan: false

hcpbridge:
  id: hcpbridge_id
  rx_pin: 18 # optional, default=18
  tx_pin: 17 # optional, default=17
  #rts_pin : 1 # optional RTS pin to use if hardware automatic control flow is not available.

cover:
  - platform: hcpbridge
    name: ${friendly_name}
    device_class: garage
    id: garagedoor_cover

binary_sensor:
  - platform: hcpbridge
    is_connected:
      name: "${connection_state}"
      id: sensor_connected
    relay_state:
      name: "${relay_name}"
      id: sensor_relay
      #on_state:
      #create your automation based on Garage Door Relay state

  # --- In1 / In2 screw terminals of the prebuilt HCP PCBs -------------------
  # These are ~5V VOLTAGE inputs, not dry-contact inputs: the board has a fixed
  # 1.2k series + 2.2k pull-down divider (5V in -> 3.24V at the pin). A button
  # must therefore SWITCH ~5V onto the terminal against board GND; the 2.2k
  # pulls the pin low again when it is released. Never apply 12V or 24V.
  # Because of that pull-down, do NOT enable an internal pullup and do NOT
  # invert - the internal pullup would be overpowered and the pin would read
  # LOW permanently.
  # Pins on PCB v3.x: In1 = GPIO12, In2 = GPIO14 (the HCP mini has no In/Out).
  # Uncomment the block for the inputs your board actually has.
  # - platform: gpio
  #   name: "${friendly_name} Input 1"
  #   id: input_1
  #   pin:
  #     number: GPIO12
  #     mode:
  #       input: true
  #   filters:
  #     - delayed_on_off: 50ms
  #   on_press:
  #     # local button action - e.g. toggle the SupraMatic light
  #     - light.toggle: gd_light
  # - platform: gpio
  #   name: "${friendly_name} Input 2"
  #   id: input_2
  #   pin:
  #     number: GPIO14
  #     mode:
  #       input: true
  #   filters:
  #     - delayed_on_off: 50ms
  #   on_press:
  #     - cover.toggle: garagedoor_cover

output:
  - platform: hcpbridge
    id: output_light

light:
  - platform: hcpbridge
    id: gd_light
    output: output_light
    name: ${light_name}

button:
  - platform: hcpbridge
    vent_button:
      id: button_vent
      name: "${btn_vent}"
    impulse_button:
      id: button_impulse
      name: "${btn_impulse}"
    half_button:
      id: button_half
      name: "${btn_half}"

text_sensor:
  - platform: hcpbridge
    id: sensor_templ_state
    name: "${sen_txt}"
#    filters:
#      - substitute:
#        - "Opening -> your text"
#        - "Move venting -> your text"
#        - "Move half -> your text"
#        - "Closing -> your text"
#        - "Open -> your text"
#        - "Closed -> your text"
#        - "Stopped -> your text"
#        - "Half open -> your text"
#        - "Venting -> your text"
#        - "Unknown -> your text"

switch:
  - platform: hcpbridge
    vent_switch:
      id: switch_vent
      name: "${sw_vent}"
      restore_mode: disabled
    half_switch:
      id: half_switch
      name: "${sw_half}"
      restore_mode: disabled

  # --- Out1 / Out2 screw terminals of the prebuilt HCP PCBs -----------------
  # HIGH-SIDE switches: the GPIO drives an optocoupler which pulls the gate of
  # an N-channel MOSFET to the rail selected by the on-board "5V | - | 3V"
  # jumper. Switched on the terminal SOURCES that voltage (minus roughly one
  # MOSFET threshold), switched off it is high impedance. Both optocoupler sides
  # share the board GND, so this is a driver stage, not galvanic isolation.
  # Never drive a load directly - feed a relay module input instead (active
  # HIGH; active-low modules need an extra inverting stage).
  # Set inverted: true only if ON/OFF end up swapped for your wiring.
  # Pins on PCB v3.x: Out1 = GPIO25, Out2 = GPIO22.
  # - platform: gpio
  #   name: "${friendly_name} Output 1"
  #   id: output_1
  #   pin:
  #     number: GPIO25
  #     inverted: false
  #   restore_mode: ALWAYS_OFF
  # - platform: gpio
  #   name: "${friendly_name} Output 2"
  #   id: output_2
  #   pin:
  #     number: GPIO22
  #     inverted: false
  #   restore_mode: ALWAYS_OFF

sensor:
  - platform: hcpbridge
    id: sensor_position
    name: ${sen_pos}
  - platform: bme280_i2c
    temperature:
      name: "BME280 Temperature"
    pressure:
      name: "BME280 Pressure"
    humidity:
      name: "BME280 Humidity"
    address: 0x76 # can be 0x77 as well
    update_interval: 30s
  # DHT disabled by default: the BME280 above already provides temperature + humidity.
  # Enable this block ONLY if you actually have a DHT sensor wired to GPIO04.
  # Running both with only one sensor physically present spams read errors in the log.
  # - platform: dht
  #   pin: GPIO04
  #   temperature:
  #     name: "DHT Temperature"
  #   humidity:
  #     name: "DHT Humidity"
  #   update_interval: 30s

api:
  encryption:
    key: !secret api_key
  # "actions" is the current key - it replaces "services", which is deprecated since ESPHome 2025.x
  actions:
    - action: go_to_open
      then:
        - lambda: |-
            id(garagedoor_cover).on_go_to_open();
    - action: go_to_close
      then:
        - lambda: |-
            id(garagedoor_cover).on_go_to_close();
    - action: go_to_half
      then:
        - lambda: |-
            id(garagedoor_cover).on_go_to_half();
    - action: go_to_vent
      then:
        - lambda: |-
            id(garagedoor_cover).on_go_to_vent();
    - action: toggle
      then:
        - cover.toggle: garagedoor_cover

web_server:
  port: 80
  version: 3
  auth:
    username: !secret web_username
    password: !secret web_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Multi-AP networks (same SSID on several APs, e.g. UniFi/mesh):
  # fast_connect must stay false (the default) - ESPHome then scans all
  # channels and associates with the AP that has the strongest signal instead
  # of the first one found. Only set it to true for hidden SSIDs.
  fast_connect: false

captive_portal:

improv_serial:

# Enable logging
logger:
  level: WARN

# Example configuration entry
ota:
  - platform: esphome